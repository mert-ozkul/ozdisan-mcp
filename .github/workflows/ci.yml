name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Her gün 06:00 UTC: canlı siteye karşı uçtan uca testler (site değişikliklerini erken yakalamak için)
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  unit:
    name: Birim testleri (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Yayınlanacak paket eksiksiz mi ve CLI çalışıyor mu?
      - run: npm pack --dry-run
      - run: node dist/index.js --version

  e2e:
    name: Uçtan uca testler (canlı ozdisan.com)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  doctor:
    # Site yapısı değiştiyse uç nokta denetimleri burada kırmızıya döner (günlük + elle).
    name: Uç nokta teşhisi (canlı)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run doctor -- --json
